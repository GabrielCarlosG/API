services:
  db:
    image: postgres:18.7
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?senha vazia}
      POSTGRES_USER: ${DB_USER:?falta usuario}
      POSTGRES_DB: ${DB_NAME:?falta o nome do banco}
    ports:
      - "5432:5432" 
    volumes:
      - dados_postgres:/var/lib/postgresql 
volumes:
  dados_postgres: 